[[thermometers]]
name = "1K"
hardware = "CTC100-thermometer"
# conversion_csv: Filename of CSV calibration curve (searches custom/ then default/ under calibration-curves/),
# an absolute path, or an http(s):// URL (re-downloaded into a temp-dir cache on each HAL startup)
conversion_csv = "RO600.csv"
# Arguments that will be passed to setup() in the hardware driver
setup.address = "/dev/serial/by-id/usb-uClinux_2.6.12-uc0_with_isp1161a1-dcd_SRS_PTC_10_0-if00"
setup.channelname = "1K"

[[thermometers]]
name = "1K-pump"
hardware = "CTC100-thermometer"
conversion_csv = "DC2023.csv"
setup.address = "/dev/serial/by-id/usb-uClinux_2.6.12-uc0_with_isp1161a1-dcd_SRS_PTC_10_0-if00"
setup.channelname = "1"

[[thermometers]]
name = "1K-main-plate"
hardware = "CTC100-thermometer"
conversion_csv = "DC2023.csv"
# Arguments that will be passed to setup() in the hardware driver
setup.address = "/dev/serial/by-id/usb-uClinux_2.6.12-uc0_with_isp1161a1-dcd_SRS_PTC_10_0-if00"
setup.channelname = "2"

[[thermometers]]
name = "1K-film-burner"
hardware = "CTC100-thermometer"
conversion_csv = "https://raw.githubusercontent.com/amccaugh/thermometer-calibrations/refs/heads/main/CRC04-077-film-burner.csv"
# Arguments that will be passed to setup() in the hardware driver
setup.address = "/dev/serial/by-id/usb-uClinux_2.6.12-uc0_with_isp1161a1-dcd_SRS_PTC_10_0-if00"
setup.channelname = "3"

[[thermometers]]
name = "4k-shield-female-drawer-calibrated"
hardware = "srs-sim922"
conversion_csv = "https://raw.githubusercontent.com/amccaugh/thermometer-calibrations/refs/heads/main/6D89.csv"
setup.address = "/dev/serial/by-id/usb-067b_2303-if00-port0"
setup.slot = 3
setup.channel = 1
setup.use_raw_voltage = true

